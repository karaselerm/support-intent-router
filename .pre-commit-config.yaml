minimum_pre_commit_version: "4.3.0"
default_install_hook_types: [pre-commit]
repos:
  # Все инструменты используют версии из uv.lock и окружение проекта.
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: check-yaml
        name: Check YAML
        entry: uv run --frozen python -m pre_commit_hooks.check_yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: Check TOML
        entry: uv run --frozen python -m pre_commit_hooks.check_toml
        language: system
        types: [toml]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        entry: uv run --frozen python -m pre_commit_hooks.trailing_whitespace_fixer
        language: system
        types: [text]
      - id: end-of-file-fixer
        name: Fix end of files
        entry: uv run --frozen python -m pre_commit_hooks.end_of_file_fixer
        language: system
        types: [text]
      - id: check-added-large-files
        name: Check large files
        entry: uv run --frozen python -m pre_commit_hooks.check_added_large_files
        args: [--maxkb=500, --enforce-all]
        language: system
