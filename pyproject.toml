[project]
name = "support-intent-router"
version = "0.1.0"
description = "Учебный проект маршрутизации обращений поддержки на BANKING77"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pre-commit-hooks==6.0.0",
    "ruff==0.14.3",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".cache", "data", "artifacts", "mlruns"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
